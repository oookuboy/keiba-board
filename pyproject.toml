[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba"
version = "0.1.0"
description = "中央競馬 自動予想システム"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
keiba = "keiba.cli:main"

[tool.setuptools]
package-dir = { "" = "keiba/src" }

[tool.setuptools.packages.find]
where = ["keiba/src"]

[tool.pytest.ini_options]
testpaths = ["keiba/tests"]
pythonpath = ["keiba/src"]
