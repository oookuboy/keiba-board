<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KEIBA BOARD</title>
<style>
/* index.html のパレットをそのまま使う。同じ筐体に見えることを優先した */
:root{
  --bg:#0b0d10; --frame:#14161a; --cellbg1:#2b2e34; --cellbg2:#1c1f24;
  --ink:#f2efe9; --amber:#ffb627; --green:#6fe08a; --red:#ff6464; --dim:#8a8f98;
  --line:#23262c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink); min-height:100dvh;
  font-family:-apple-system,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:var(--frame);
  border-bottom:1px solid var(--line); padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:15px;letter-spacing:.22em;font-weight:700}
.brandrow .jp{font-size:11px;color:var(--dim)}
.totals{margin-left:auto;font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--amber)}
.totals .bad{color:var(--red)} .totals .good{color:var(--green)}
/* 有料データの欠損など、予想の前提が崩れているときだけ出る帯 */
#health.warn{margin-top:8px;padding:6px 9px;font-size:11px;line-height:1.5;
  color:var(--red);border:1px solid var(--red);border-radius:3px}

/* 開催日タブ */
#days{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
#days::-webkit-scrollbar{display:none}
#days button{
  flex:0 0 auto;background:#15181d;color:#9aa0a6;border:1px solid #2c3038;
  border-radius:999px;font-size:11px;padding:5px 12px;cursor:pointer;white-space:nowrap;
  font-family:"SF Mono",Menlo,monospace;
}
#days button.on{background:#2a2e35;color:var(--amber);border-color:var(--amber)}

/* フラップ表示。日本語はこの charset に乗らないので英数字だけに使う */
.flap{display:inline-flex;gap:2px;vertical-align:middle}
.cell{
  position:relative;width:calc(var(--ch) * .68);height:var(--ch);--ch:22px;
  border-radius:3px;background:#000;overflow:hidden;
  font-family:"Helvetica Neue",Arial,sans-serif;
}
.cell .half{
  position:absolute;left:0;right:0;height:50%;overflow:hidden;
  background:linear-gradient(180deg,var(--cellbg1),var(--cellbg2));
  display:flex;justify-content:center;
}
.cell .half span{
  font-size:calc(var(--ch) * .70);font-weight:700;line-height:var(--ch);color:var(--ink);
}
.cell .top{top:0;border-radius:3px 3px 0 0}
.cell .top span{transform:translateY(0)}
.cell .bot{bottom:0;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,#202329,#16181d)}
.cell .bot span{transform:translateY(calc(var(--ch) * -.5))}
.cell::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;
  background:rgba(0,0,0,.65);transform:translateY(-50%);z-index:5}

main{padding:12px 12px 40px;max-width:900px;margin:0 auto}
.daysum{
  font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.8;
  font-family:"SF Mono",Menlo,monospace;
}
.daysum b{color:var(--ink);font-weight:700}

/* 絞り込み */
#filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#filters button{
  background:#0e1013;border:1px solid #2c3038;color:#9aa0a6;border-radius:999px;
  font-size:11px;padding:5px 12px;cursor:pointer;letter-spacing:.05em;
}
#filters button.on{border-color:var(--amber);color:var(--amber);background:#241d0d}

/* レースカード */
.race{
  background:var(--frame);border:1px solid var(--line);border-radius:14px;
  margin-bottom:10px;overflow:hidden;
}
.race.skip{opacity:.55}
.rhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.mark{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-size:17px;font-weight:700;border:1px solid;
}
.m-◎{color:var(--amber);border-color:var(--amber);background:#241d0d}
.m-○{color:var(--green);border-color:#2f5c3c;background:#121e16}
.m-△{color:#9aa0a6;border-color:#2c3038;background:#15181d}
.m-× {color:var(--dim);border-color:#26292f;background:#101216}
.m-\?{color:#7aa7ff;border-color:#2f4570;background:#0e1420}
.rtitle{flex:1;min-width:0}
.rtitle .l1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle .l2{font-size:11px;color:var(--dim);margin-top:2px;
  font-family:"SF Mono",Menlo,monospace}
.grade{color:var(--amber);font-size:10px;border:1px solid var(--amber);
  border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
/* レース名の横に出す1〜3着の馬番。的中したレースは緑にする */
.top3{margin-left:6px;font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--dim)}
.top3.hit{color:var(--green);font-weight:700}
.spend{flex:0 0 auto;font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--dim);text-align:right}
.spend .hit{color:var(--green);font-weight:700}
.spend .miss{color:var(--red)}

.rbody{display:none;border-top:1px solid var(--line);padding:12px 13px}
.race.open .rbody{display:block}
.reason{font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:11px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;color:var(--dim);font-weight:400;font-size:10px;
  letter-spacing:.1em;padding:4px 5px;border-bottom:1px solid var(--line);
}
td{padding:6px 5px;border-bottom:1px solid #1a1d22;vertical-align:top}
tr.marked td{background:#15181d}
tr.placed td{background:#121e16}
.umaban{
  display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;
  background:#2c3038;font-family:"SF Mono",Menlo,monospace;font-size:11px;font-weight:700;
}
.hname{font-weight:700}
.hmark{font-size:14px;font-weight:700}
.why{color:var(--dim);font-size:10px;line-height:1.6;margin-top:3px}
.num{font-family:"SF Mono",Menlo,monospace;text-align:right;white-space:nowrap}

.bets{margin-top:13px;border-top:1px dashed #2c3038;padding-top:11px}
.bets h3{font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:7px}
.bet{
  display:flex;align-items:center;gap:9px;font-family:"SF Mono",Menlo,monospace;
  font-size:12px;padding:3px 0;
}
.bet .combo{color:var(--amber);font-weight:700;min-width:78px}
.bet .amt{color:var(--ink);min-width:56px;text-align:right}
.bet .why2{color:var(--dim);font-size:10px;font-family:-apple-system,sans-serif}
.bet.won .combo{color:var(--green)}
.result{margin-top:11px;font-size:12px;font-family:"SF Mono",Menlo,monospace;color:var(--dim)}
.result b{color:var(--ink)}
.empty{color:var(--dim);font-size:12px;padding:26px 0;text-align:center;line-height:1.9}
/* 回顧（表） */
.rv h2{font-size:12px;letter-spacing:.12em;color:var(--amber);margin:18px 0 6px}
.rv .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rv table{border-collapse:collapse;width:100%;font-size:11px;min-width:520px}
.rv th{white-space:nowrap}
.rv td{padding:5px 5px;white-space:nowrap}
.rv td.wrap{white-space:normal;min-width:160px}
.rv .g{color:var(--green)} .rv .r{color:var(--red)} .rv .d{color:var(--dim)}
.rv .kpi{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rv .kpi div{background:#15181d;border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:11px}
.rv .kpi b{display:block;font-size:15px;font-family:"SF Mono",Menlo,monospace}
.rv .rr{border-bottom:1px solid var(--line);padding:8px 2px;font-size:12px;line-height:1.6}
.rv .rr .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rv .rr .h b{font-size:12px}
.rv .rr .h .res{margin-left:auto}
.rv .rr .fin{font-size:11px;margin-top:2px}
.rv .rr .fin span{display:inline-block;min-width:2.6em;color:var(--dim)}
.rv .rr .why{font-size:10px}
.note{color:var(--dim);font-size:10px;line-height:1.8;margin-top:22px;
  border-top:1px solid var(--line);padding-top:13px}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <h1>KEIBA BOARD</h1>
    <span class="jp">中央競馬 自動予想</span>
    <span class="totals" id="totals"></span>
  </div>
  <div id="health" hidden></div>
  <div id="days"></div>
</header>

<main>
  <div class="daysum" id="daysum"></div>
  <div id="filters">
    <button data-f="all" class="on">ALL</button>
    <button data-f="bet">買い目あり</button>
    <button data-f="hit">的中</button>
    <button data-f="◎">◎ 勝負</button>
    <button data-f="○">○</button>
    <button data-f="△">△</button>
    <button data-f="×">× 見送り</button>
    <button data-f="?">? オッズ待ち</button>
    <button data-f="review">回顧（表）</button>
  </div>
  <div id="races"></div>
  <p class="note">
    ◎○△× はレース単位の自信度。能力評価の上位3頭がどれだけ人気薄に寄っているかで決まる。
    × は上位人気で堅く収まる形と判断したもので、買い目を出さない。
    ? はオッズがまだ出ておらず妙味を判定できない状態。前日夜の予想はここに入り、
    当日の再評価で ◎○△× に確定する。<br>
    馬の能力スコアにオッズ・人気は一切使っていない。人気を見るのは自信度の判定と配分だけ。<br>
    競馬は不確実性を伴う。この予想は的中を保証しない。
  </p>
</main>

<script>
"use strict";

/* ===== split-flap: index.html の実装を流用 =====
   日本語はこの charset に乗らないので、フラップは英数字（自信度・買い目・
   金額）にだけ使い、馬名やレース名は通常のテキストで描く。 */
const CHARSET=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:/.-+%";
const CIDX={};[...CHARSET].forEach((c,i)=>CIDX[c]=i);
const norm=c=>{c=(c||" ").toUpperCase();return CIDX[c]===undefined?" ":c};

function flap(text,size){
  const wrap=document.createElement("span");
  wrap.className="flap";
  [...String(text)].forEach(ch=>{
    const c=document.createElement("span");
    c.className="cell";
    if(size)c.style.setProperty("--ch",size+"px");
    const g=norm(ch);
    c.innerHTML=`<span class="half top"><span>${g}</span></span>`+
                `<span class="half bot"><span>${g}</span></span>`;
    wrap.appendChild(c);
  });
  return wrap;
}

const yen=n=>(n==null?"—":n.toLocaleString("ja-JP")+"円");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;
  if(h!=null)e.innerHTML=h;return e};

/* ===== データ読み込み ===== */
let INDEX=null, DAY=null, FILTER="all";

async function boot(){
  try{
    INDEX=await (await fetch("keiba/data/index.json",{cache:"no-cache"})).json();
  }catch(e){
    document.getElementById("races").innerHTML=
      '<p class="empty">keiba/data/index.json を読めない。<br>'+
      'keiba-predict ワークフローがまだ走っていない可能性がある。</p>';
    return;
  }
  if(!INDEX.days||!INDEX.days.length){
    document.getElementById("races").innerHTML=
      '<p class="empty">まだ予想がない。</p>';
    return;
  }
  renderTotals();
  await renderHealth();
  renderDays();
  await load(INDEX.days[0].date);
}

/* 有料データが入っているかをボードに出す。
   収集ステップは continue-on-error なので、課金切れ・ログイン失敗・仕様変更の
   どれが起きてもジョブは緑のまま通り、黙って調教なしに戻る。`::warning::` は
   入れてあったが、ログの中に埋もれて実際に数日見落とした（2026-08-28 に
   18.1% で鳴っていた）。見えるところに出す。 */
async function renderHealth(){
  const box=document.getElementById("health");
  if(!box)return;
  let h;
  try{ h=await (await fetch("keiba/data/health.json",{cache:"no-cache"})).json(); }
  catch(e){ return; }
  /* 有料データは種類ごとに欠け方が違う。調教だけ見ていたせいで、厩舎コメントが
     0件のまま週末に入っても気づけなかった（2026-09-05）。両方出す。

     分母は**出ているレース**。netkeiba は全レースに厩舎コメントを出すわけでは
     なく、2026-09-12 は新馬と 9R 以降の10レースだけだった（未勝利・1勝クラスは
     1頭も無い）。全出走馬を分母にすると 39.9% になり、取りこぼしゼロでも赤帯が
     出っぱなしになる。出る／出ないはこちらで決められないので、決められること
     （出ているレースを取りこぼさない）だけを見る。 */
  const kinds=[["workouts","調教"],["comments","厩舎コメント"]];
  const bad=kinds
    .map(([key,label])=>[label,h&&h[key]])
    .filter(([,v])=>v&&v.races&&(!v.served_races||v.served_rate<0.5))
    .map(([label,v])=>v.served_races
      ? `${label} 出ている${v.served_races}Rで ${(v.served_rate*100).toFixed(1)}%`
        +`（${v.served_runners}頭中 ${v.fresh}頭・${v.checked} 時点）`
      : `${label}が1レースも取れていない（${v.races}R中0R・${v.checked} 時点）`);
  if(!bad.length){ box.hidden=true; return; }
  box.hidden=false;
  box.className="warn";
  box.textContent=`有料データが欠けている: ${bad.join(" / ")}。予想はこの状態で出ている。`;
}

function renderTotals(){
  /* 回顧の済んだ日だけを数える。以前は returned が null の日（＝まだ結果を
     突き合わせていない日）を「投資あり・払戻0円」として足していたので、
     レース当日は夜の回顧が終わるまで通算回収率が実際より低く出ていた。 */
  const done=INDEX.days.filter(d=>d.returned!==null&&d.returned!==undefined&&d.spend);
  if(!done.length)return;
  const t=done.reduce((a,d)=>({
    spend:a.spend+d.spend, ret:a.ret+d.returned, hits:a.hits+(d.hits||0)
  }),{spend:0,ret:0,hits:0});
  const roi=t.ret/t.spend*100;

  /* 目標: まず1日でも回収100%、次に2日連続。日付の新しい順に並んでいるので
     古い順に直してから数える。 */
  const chrono=[...done].sort((a,b)=>a.date<b.date?-1:1);
  let best=0, run=0, over=0;
  for(const d of chrono){
    if(d.returned/d.spend>=1){ over++; run++; best=Math.max(best,run); }
    else run=0;
  }
  /* 達成したぶんだけ出す。未達を書き足しても情報が増えないし、毎回
     「まだ無い」と言われるボードは見たくない。 */
  const goal = best>=2 ? ` ・ <span class="good">2日連続 達成（最長${best}日）</span>`
             : over>0  ? ` ・ <span class="good">100%超え ${over}日</span>`
             :           "";

  document.getElementById("totals").innerHTML=
    `通算 ${t.hits}的中 / <span class="${roi>=100?'good':'bad'}">回収率 `+
    `${roi.toFixed(1)}%</span>${goal}`;
}

function renderDays(){
  const box=document.getElementById("days");
  box.innerHTML="";
  INDEX.days.forEach(d=>{
    const b=el("button",null,d.date.slice(5));
    b.dataset.date=d.date;
    b.onclick=()=>load(d.date);
    box.appendChild(b);
  });
}

async function load(date){
  [...document.querySelectorAll("#days button")]
    .forEach(b=>b.classList.toggle("on",b.dataset.date===date));
  DAY=await (await fetch(`keiba/data/${date}.json`,{cache:"no-cache"})).json();
  renderSummary();
  FILTER==="review" ? renderReview() : renderRaces();
}

function renderSummary(){
  const s=DAY.summary, c=s.by_confidence||{};
  let html=`<b>${DAY.date}</b> ／ ${s.races}R 中 <b>${s.bet}R</b> を勝負・`+
           `${s.skipped}R 見送り<br>`+
           `◎${c["◎"]||0} ○${c["○"]||0} △${c["△"]||0} ×${c["×"]||0}`+
           (c["?"]?` ?${c["?"]}（オッズ待ち）`:"")+
           ` ／ 投資 <b>${yen(s.spend)}</b>`;
  if(s.returned!=null){
    const roi=s.roi==null?0:s.roi;
    html+=` → 払戻 <b>${yen(s.returned)}</b>`+
          ` <span style="color:${roi>=100?'var(--green)':'var(--red)'}">`+
          `回収率 ${roi.toFixed(1)}%</span>（的中 ${s.hits}R）`;
  }else{
    html+=" ／ 結果待ち";
  }
  // 1日の上限で減額・見送りをしたなら、その事実を隠さず出す
  if(s.budget_actions&&s.budget_actions.length){
    html+=`<br><span style="color:var(--amber)">予算調整: ${
      s.budget_actions.join(" / ")}</span>`;
  }
  document.getElementById("daysum").innerHTML=html;
}

document.getElementById("filters").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  FILTER=b.dataset.f;
  [...document.querySelectorAll("#filters button")]
    .forEach(x=>x.classList.toggle("on",x===b));
  FILTER==="review" ? renderReview() : renderRaces();
};

function visible(r){
  if(FILTER==="all")return true;
  if(FILTER==="bet")return r.bets.length>0;
  // 当たったレースだけ。回顧が済んでいない日は result がまだ無い
  if(FILTER==="hit")return !!(r.result && r.result.hit);
  return r.confidence===FILTER;
}

function renderRaces(){
  const box=document.getElementById("races");
  box.innerHTML="";
  const list=DAY.races.filter(visible);
  if(!list.length){
    box.appendChild(el("p","empty", FILTER==="hit"
      ? "的中したレースはまだない。（回顧前の日は結果が入っていない）"
      : "該当するレースがない。"));
    return;
  }
  list.forEach(r=>box.appendChild(raceCard(r)));
}

function raceCard(r){
  const card=el("div","race"+(r.bets.length?"":" skip"));
  const head=el("div","rhead");

  // ◎○△× は split-flap の charset に無い記号なので、フラップにせず直接描く
  const mark=el("div","mark m-"+r.confidence);
  mark.textContent=r.confidence;
  head.appendChild(mark);

  const t=el("div","rtitle");
  // 一覧のまま結果が分かるよう、レース名の横に1〜3着の馬番を出す。
  // 的中なら緑にして、開かなくても当たり外れが見えるようにする。
  const top3=r.result&&r.result.top3
    ? `<span class="top3${r.result.hit?" hit":""}">(${r.result.top3.join("-")})</span>`
    : "";
  t.appendChild(el("div","l1",
    `${r.venue}${r.race_no}R ${r.name}`+(r.grade?`<span class="grade">${r.grade}</span>`:"")+top3));
  const cond=[`${r.surface}${r.direction||""}${r.distance}m`,
              r.going?`馬場${r.going}`:null, r.post_time, `${r.field_size}頭`,
              r.pace?`${r.pace}想定`:null].filter(Boolean).join(" / ");
  t.appendChild(el("div","l2",cond));
  head.appendChild(t);

  const sp=el("div","spend");
  if(r.bets.length){
    sp.innerHTML=`${r.bets.length}点<br>${yen(r.spend)}`;
    if(r.result){
      sp.innerHTML+=r.result.hit
        ? `<br><span class="hit">+${yen(r.result.returned)}</span>`
        : `<br><span class="miss">不的中</span>`;
    }
  }else{
    // 自信度で切ったのか予算で切ったのかは意味が違うので区別して出す
    sp.innerHTML=r.confidence==="?"?"オッズ<br>待ち"
                : r.budget_skipped?"予算で<br>見送り":"見送り";
  }
  head.appendChild(sp);

  head.onclick=()=>card.classList.toggle("open");
  card.appendChild(head);
  card.appendChild(raceBody(r));
  return card;
}

// 人気は画面に出さない。見えると引きずられるため、利用者の指示で消した。
// **記録（JSON）には残している。** 回顧と検証には人気が要るし、消すと
// 「なぜその自信度になったか」を後から辿れなくなる。ここは表示だけの話。
function hidePopularity(text){
  return (text||"")
    .replace(/能力上位3頭の人気和\d+/g, "能力評価の上位3頭")
    .replace(/（本線の帯\s*[\d\-]+）/g, "")
    .replace(/上位人気で堅く収まる形/g, "堅く収まる形")
    .replace(/。+/g, "。")
    .replace(/^[。・]\s*/, "")
    .trim();
}

function raceBody(r){
  const body=el("div","rbody");
  body.appendChild(el("div","reason",hidePopularity(r.confidence_reason)));

  const placed=new Set((r.result&&r.result.top3)||[]);
  const tbl=el("table");
  tbl.innerHTML="<thead><tr><th>印</th><th>馬番</th><th>馬名 / 根拠</th>"+
                "<th class='num'>スコア</th><th class='num'>脚質</th></tr></thead>";
  const tb=el("tbody");
  r.horses.forEach(h=>{
    const tr=el("tr",(h.mark?"marked ":"")+(placed.has(h.umaban)?"placed":""));
    tr.appendChild(el("td","hmark",h.mark||""));
    tr.appendChild(el("td",null,`<span class="umaban">${h.umaban}</span>`));
    const why=(h.reasons||[]).slice(0,3).join(" ／ ");
    tr.appendChild(el("td",null,
      `<div class="hname">${h.name}</div><div class="why">${why}</div>`));
    tr.appendChild(el("td","num",h.score.toFixed(1)));
    tr.appendChild(el("td","num",h.style+(h.lone_front_runner?" 単騎":"")));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  body.appendChild(tbl);

  if(r.bets.length){
    const box=el("div","bets");
    box.appendChild(el("h3",null,`買い目 ${r.bets.length}点 ／ 合計 ${yen(r.spend)}`));
    const winTrio=r.result?[...r.result.top3].sort((a,b)=>a-b).join("-"):null;
    const winTri=r.result?r.result.top3.join("-"):null;
    r.bets.forEach(b=>{
      const won=(b.type==="三連複"&&b.combination===winTrio)||
                (b.type==="三連単"&&b.combination===winTri);
      const row=el("div","bet"+(won?" won":""));
      row.appendChild(el("span",null,b.type));
      const combo=el("span","combo");
      combo.appendChild(flap(b.combination,18));
      row.appendChild(combo);
      row.appendChild(el("span","amt",yen(b.amount)));
      row.appendChild(el("span","why2",b.why+(won?" ★的中":"")));
      box.appendChild(row);
    });
    body.appendChild(box);
  }

  if(r.result){
    const names=r.result.top3_names||[];
    body.appendChild(el("div","result",
      `結果 <b>${r.result.top3.join(" → ")}</b>`+
      (names.length?`（${names.join(" → ")}）`:"")+
      (r.result.hit?` ／ <b style="color:var(--green)">的中 ${yen(r.result.returned)}</b>`:"")));
  }
  return body;
}

/* ===== 回顧（表） =====
   回顧が済んだ日の結果を表にまとめる。毎回同じ形で見られるよう、JSON から
   その場で組み立てる（手で書く回顧は作らない）。
   人気は予想の画面では隠しているが、ここは**結果が出たあと**の振り返りなので
   出す。穴が来たか・拾えたかは人気が無いと判断できない。 */
const pct=(a,b)=>b?`${Math.round(a/b*100)}%`:"—";
const MARKS=["◎","○","▲","☆"];
let DAYCACHE={};

async function dayJson(date){
  if(!DAYCACHE[date])
    DAYCACHE[date]=await (await fetch(`keiba/data/${date}.json`,{cache:"no-cache"})).json();
  return DAYCACHE[date];
}

function graded(d){ return d.races.filter(r=>r.result&&r.result.top3&&r.result.top3.length===3); }

function markStats(d){
  // 印ごと＋1番人気の、頭数・1着・3着内
  const rows={}; [...MARKS,"1番人気"].forEach(k=>rows[k]={n:0,win:0,p3:0});
  for(const r of graded(d)){
    const top=r.result.top3;
    for(const h of r.horses){
      const keys=[]; if(h.mark&&rows[h.mark])keys.push(h.mark);
      if(h.popularity===1)keys.push("1番人気");
      for(const k of keys){
        rows[k].n++; if(top[0]===h.umaban)rows[k].win++; if(top.includes(h.umaban))rows[k].p3++;
      }
    }
  }
  return rows;
}

function table(head, rows){
  return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`+
         `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td${c&&c.wrap?' class="wrap"':''}>${c&&c.v!=null?c.v:(c??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

async function renderReview(){
  const box=document.getElementById("races");
  box.innerHTML="";
  const d=DAY, g=graded(d), s=d.summary;
  const wrap=el("div","rv");
  if(!g.length){
    box.appendChild(el("p","empty","この日はまだ回顧が済んでいない（結果が入っていない）。"));
    return;
  }
  const hitR=g.filter(r=>r.result.hit).length;
  const roi=s.spend?(s.returned||0)/s.spend*100:0;
  let html=`<h2>${d.date} のまとめ</h2><div class="kpi">`+
    `<div>回収率<b class="${roi>=100?'g':'r'}">${roi.toFixed(1)}%</b></div>`+
    `<div>投資 → 払戻<b>${yen(s.spend)} → ${yen(s.returned)}</b></div>`+
    `<div>的中<b>${hitR} / ${s.bet}R</b></div>`+
    `<div>見送り<b>${s.skipped}R</b></div>`+
    `<div>最高配当<b>${yen(s.best_race||0)}</b></div></div>`;

  // 印の成績
  const ms=markStats(d);
  html+=`<h2>印の成績（${g.length}R）</h2>`+table(["印","頭数","1着","勝率","3着内","3着内率"],
    Object.entries(ms).map(([k,v])=>[k,v.n,v.win,pct(v.win,v.n),v.p3,pct(v.p3,v.n)]));

  // レース別（スマホで横にはみ出さないよう、1レースずつ縦に積む）
  html+=`<h2>レース別</h2>`;
  for(const r of g){
    const by=Object.fromEntries(r.horses.map(h=>[h.umaban,h]));
    const bet=r.bets.length?(r.result.hit?`<span class="g">的中 ${yen(r.result.returned)}</span>`:`<span class="r">外れ ${yen(r.spend)}</span>`):'<span class="d">見送り</span>';
    const hon=r.horses.find(h=>h.mark==="◎");
    const honPos=hon?(r.result.top3.indexOf(hon.umaban)+1):0;
    const fin=r.result.top3.map((u,i)=>{
      const h=by[u]||{};
      const hole=(h.popularity||0)>=6;
      return `<div class="fin"><span>${i+1}着</span>${u} ${h.name||""}`+
        `（${h.popularity||"?"}番人気・${h.mark?h.mark:'<span class="r" style="min-width:0">無印</span>'}）`+
        (hole?' <b class="g">穴</b>':'')+`</div>`;
    }).join("");
    html+=`<div class="rr"><div class="h"><b>${r.venue}${r.race_no}R</b>${r.name}`+
      `<span class="d">${r.going||""}・判定${r.confidence}</span><span class="res">${bet}</span></div>`+
      (hon?`<div class="fin"><span>◎</span>${hon.name}（${hon.popularity||"?"}番人気）→ `+
        (honPos?`<span class="g" style="min-width:0">${honPos}着</span>`:'<span class="r" style="min-width:0">着外</span>')+`</div>`:"")+
      fin+`</div>`;
  }

  // 穴の見立て: 6番人気以下で3着以内に来た馬を、印で拾えたか
  const holes=[];
  for(const r of g){
    for(const [i,u] of r.result.top3.entries()){
      const h=r.horses.find(x=>x.umaban===u);
      if(h&&h.popularity>=6){
        const apt=(h.reasons||[]).filter(x=>x.includes("適性")).slice(0,3).join(" ／ ")
                  ||(h.reasons||[]).slice(0,2).join(" ／ ");
        holes.push(`<div class="rr"><div class="h"><b>${r.venue}${r.race_no}R ${i+1}着</b>`+
          `${h.umaban} ${h.name}（${h.popularity}番人気）<span class="res">`+
          (h.mark?`<span class="g">${h.mark} 拾えた</span>`:'<span class="r">無印＝見逃し</span>')+
          `</span></div><div class="why">${apt}</div></div>`);
      }
    }
  }
  const caught=holes.filter(x=>x.includes("拾えた")).length;
  html+=`<h2>穴（6番人気以下）の3着内 ${holes.length}頭 ／ 印で拾えた ${caught}頭</h2>`+
    (holes.length?holes.join(""):'<p class="d">なし</p>');
  wrap.innerHTML=html;
  box.appendChild(wrap);

  // 通算（回顧の済んだ日）
  const done=INDEX.days.filter(x=>x.returned!=null&&x.spend);
  const rows=[]; let S=0,R=0;
  for(const x of done){
    let hon="—", fav="—";
    try{
      const dj=await dayJson(x.date); const m=markStats(dj);
      hon=pct(m["◎"].p3,m["◎"].n); fav=pct(m["1番人気"].p3,m["1番人気"].n);
    }catch(e){}
    S+=x.spend; R+=x.returned;
    const r=x.returned/x.spend*100;
    rows.push([x.date,yen(x.spend),yen(x.returned),`<span class="${r>=100?'g':'r'}">${r.toFixed(1)}%</span>`,x.hits||0,hon,fav]);
  }
  const tot=el("div","rv");
  tot.innerHTML=`<h2>通算（回収率 ${(R/S*100).toFixed(1)}%）</h2>`+
    table(["日付","投資","払戻","回収率","的中R","◎の3着内率","1番人気の3着内率"],rows);
  box.appendChild(tot);
}

boot();
</script>
</body>
</html>
