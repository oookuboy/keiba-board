# 予想エンジンの重み。
#
# 初期値は SKILL.md の記述（何を「最重要」と書いているか）から手で置いたもので、
# データ駆動ではない。3年分のバックフィルが揃ったら backtest.py が回収率を基準に
# ここを書き換える。チューニングはこのファイルだけを触ること。

engine_version: "0.1.0"

# --- 能力スコアの配点 -------------------------------------------------------
# 各要素は 0.0〜1.0 に正規化された値を返し、ここでの重みを掛けて合算する。
# 合計 100 点。オッズ・人気はここに一切入らない（SKILL.md の絶対ルール）。
weights:
  pedigree: 22          # 血統の芝ダ・距離適性。SKILL.md が「最重要」と明記
  condition_change: 18  # 条件一変7パターン
  pace: 20             # 展開・ペース。SKILL.md が「予想の核心」と明記
  form: 18             # 同条件好走歴・格
  jockey: 10           # 騎手成績と馬との相性
  condition: 12        # 馬体重・調教

# --- 血統適性（教訓1） ------------------------------------------------------
pedigree:
  # sire_aptitude.json をこの出走数未満でしか持たない父は信用しない
  min_sire_runs: 30
  # 父のサンプルが足りないとき母父へ落とす。母父も足りなければ中立値 0.5
  fallback_to_damsire: true
  neutral: 0.5
  # ダート→芝（またはその逆）替わりで、父の当該馬場適性が高いときの加点。
  # 「ダートでの大敗を能力不足と誤読しない」を数値化したもの。
  surface_switch:
    enabled: true
    # 父の複勝率が今走馬場でこの値以上なら替わりボーナスの対象
    min_place_rate: 0.28
    # 前走までの当該馬場での連続大敗（着順がこの値以下）を減点対象から外す
    forgive_finish_worse_than: 8
    max_bonus: 1.0

# --- 条件一変（SKILL.md の7パターン表） --------------------------------------
#
# 7パターンのうち「調教師コメント『変化あり』」は取得源が無い。netkeiba の
# 厩舎コメントは有料プラン限定（本文が伏せ字になることを実測で確認）で、
# JRA公式も per-horse のコメントは公開していない。
# よって trainer_comment は 0.0 に落とし、その配分を残る6パターンへ回した。
# 判定コード（features.condition_changes）は残してあるので、データ源が
# 見つかったら重みを戻すだけで効く。
condition_change:
  surface_switch: 1.2        # ダート→芝替わり（欧州型血統）。最も効く一変
  distance_stretch: 0.85     # 距離延長（スタミナ型）
  distance_shorten: 0.85     # 距離短縮（スピード型）
  course_switch: 0.75        # コース替わり（得意コース）
  second_off_layoff: 1.0     # 休養明け2走目（叩き良化型）
  jockey_upgrade: 0.85       # 騎手強化
  trainer_comment: 0.0       # 取得源なし。データ源が見つかったら 0.9 に戻す

  # 休養明けの判定境界（日）
  layoff_days: 90
  recent_days: 60
  # 距離延長・短縮とみなす最小差（m）
  distance_delta: 200
  # 騎手強化とみなす直近1年勝率の差
  jockey_winrate_gap: 0.04
  # 調教師コメントで前向きと取るキーワード
  positive_keywords:
    - 変わり身
    - 良化
    - 態勢
    - 攻めた
    - 勝負
    - 上向き
    - 気配
    - 仕上が
    - 動きは良

# --- 展開・ペース（教訓2・7・8） ---------------------------------------------
pace:
  # 過去5走のコーナー通過順÷頭数 の平均から脚質を決める境界
  style_thresholds:
    逃げ: 0.15
    先行: 0.40
    差し: 0.70
  # 教訓7: 少頭数では「複数逃げ馬＝ハイペース」を機械的に適用しない。
  # 出走頭数がこれ以下なら隊列がすんなり決まる前提で先行有利を基本にする
  small_field_max: 10
  # 多頭数でこの数以上の逃げ馬がいればハイペース必至と判断する
  multi_front_runners: 2
  # 想定ペースごとに恩恵を受ける脚質への加点
  bonus:
    slow:  { 逃げ: 1.0, 先行: 0.8, 差し: 0.3, 追込: 0.1 }
    mid:   { 逃げ: 0.6, 先行: 0.7, 差し: 0.6, 追込: 0.4 }
    fast:  { 逃げ: 0.1, 先行: 0.3, 差し: 0.9, 追込: 1.0 }
  # 教訓8: 単騎逃げが確定的な馬は能力評価が低くてもここまでは落とさない。
  # 「確逃げ馬は絶対に切らない」をスコアの床として実装する
  lone_front_runner_floor: 55.0

# --- 実績・格（教訓9・11・12） ----------------------------------------------
form:
  lookback_runs: 6
  # 同条件（コース・距離帯・馬場）好走の加点
  same_condition_place: 1.0
  # 教訓12: 下級条件での連続好走より、格上で揉まれた降級馬を上に置く
  class_drop_bonus: 0.8
  # 教訓11: 長期休み明けでも「能力の証明がある馬」は3着候補から外さない。
  # 実績該当馬に適用するスコアの床
  proven_ability_floor: 50.0
  layoff_penalty: 0.5        # 実績が無い馬の長期休み明けへの減点
  # 直近走の着順を評価に変換する上限（これ以内なら好走扱い）
  good_finish: 3

# --- 騎手 -------------------------------------------------------------------
jockey:
  # 直近この日数の成績を見る
  lookback_days: 365
  # 馬×騎手のコンビ成績はサンプルが薄いので、この騎乗数未満は重みを半分に
  min_combo_runs: 3
  combo_weight: 0.35
  venue_weight: 0.65

# --- 馬体重・調教 -----------------------------------------------------------
condition:
  # 前走比増減がこの絶対値を超えたら減点
  weight_swing_penalty_kg: 20
  # 休み明けで絞れている（マイナス体重）のは前向きに取る
  layoff_trim_bonus: 0.4
  # 追い切りが取得できない場合の中立値
  neutral: 0.5

# --- 自信度 ◎○△× -----------------------------------------------------------
# ここで初めてオッズ（人気）を使う。能力評価は features/engine が人気を
# 一切見ずに済ませており、この層は「その並びが世間とどれだけズレているか」を
# 測るだけ。
#
# 閾値は手置きではなく実測。2026年の1,782レースを層別に測った回収率:
#
#   能力上位3頭の人気和   R数   的中率   回収率
#   〜8（堅い）           464   73.9%   76.9%
#   9-13                  695   28.3%   89.9%  ← 最良
#   14-19                 447    6.5%   63.3%
#   20-27                 144    0.7%   18.2%
#   28+（大穴）            16    0.0%    0.0%
#
# 穴に寄るほど回収率が単調に下がり、100%を超える区分は無い（3連複の控除率は
# 27.5%なので、でたらめに買っても約72.5%）。よって本線は最良の 9-13 に置き、
# 穴は「当たれば大きい」ことを承知のうえで別枠・薄く買う構成にする。
confidence:
  # 本線の帯。実測で最も回収率が高い区分
  main_band: [9, 13]
  # ここ以上は穴枠。◎○ とは別予算で、1点最小単位のみ
  longshot_min: 14
  # ◎ を出すには人気和だけでなく能力の分離も要る。
  # スコア1位と4位の差がこれ未満なら ○ に落とす
  min_score_separation: 6.0
  # 想定3連複配当がこれ未満なら妙味不足として見送る（本線のみに適用）。
  # 30→50 に上げた。安い配当を拾う形は「穴狙い」という目的そのものに反する。
  min_expected_odds: 50.0

# --- 買い目 -----------------------------------------------------------------
# 配分は5パターンを実測して決めた（2026年 1,775レース）。
#
#   現行(◎300/○200/△100)  75.4%
#   フラット100円            76.1%
#   ＋配当50倍下限           78.8%
#   ＋印5頭まで              80.7%   ← 印を6頭から5頭に減らすのが最も効いた
#   ＋3連単なし              87.6%
#
# ただしこの差の大半は分散である。同じ設定を期間で割ると 1-4月 76.3% /
# 5-8月 94.4% と大きく振れ、払戻上位3件を除くだけで全体が 94.1%→74.4%
# （＝でたらめに買った場合とほぼ同じ）まで落ちる。よって「最も高い数字が出た
# 設定」ではなく「理由を説明できる変更」だけを採用した:
#
#   フラット100円  厚張りに実測の裏付けが無い（帯の測定はフラットで取った）
#   印5頭まで      6番手の印は買わない。ただし4頭まで削ると 71.3% に崩れる
#   配当50倍下限   安い配当を拾う形は「穴狙い」という目的に反する
#   3連単2点       券種別の実測は 三連複76.0% / 三連単73.4%。要望なので残すが絞る
betting:
  unit: 100
  # 自信度ごとの1点あたり金額とレース上限（SKILL.md の金額ルール表）。
  # per_point は全て unit と同額にした。自信度で厚さを変える根拠が実測に無い。
  # 構造は残してあるので、根拠が出たらここだけ動かせばよい。
  stake:
    "◎": { per_point: 100, race_cap: 3000 }
    "○": { per_point: 100, race_cap: 2000 }
    "△": { per_point: 100, race_cap: 600 }
  daily_cap: 20000
  # 穴枠（△）だけの1日上限。本線と財布を分ける。
  # 当たれば大きいが期待値は本線に劣ると測定済みなので、遊びの範囲に閉じる。
  longshot_daily_cap: 2000
  # 穴枠は組み合わせを広げない。◎軸から少点数だけ（6→3点）
  longshot_max_points: 3
  # 3連単は自信度◎のときだけ。実測で3連複に劣るので点数を 4→2 に絞る
  trifecta_on: ["◎"]
  trifecta_points: 2
  # 印を打つ頭数の上限（6→5）
  max_marks: 5

  # 以下は設定にしていない。betting.py で構造的に常時適用しているため。
  #   教訓10 ◎軸の全組み合わせ C(n,2) は常に敷く（閾値を設けると取りこぼす）
  #   教訓5・6 ☆を含む買い目を必ず1点
  #   教訓8 確逃げ馬を3着欄に含む買い目を必ず1点
  # 予算超過時は点数ではなく金額を削る。点数を削ると印馬の取りこぼしが生じる。
