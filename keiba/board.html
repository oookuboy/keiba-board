<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KEIBA BOARD</title>
<style>
/* index.html のパレットをそのまま使う。同じ筐体に見えることを優先した */
:root{
  --bg:#0b0d10; --frame:#14161a; --cellbg1:#2b2e34; --cellbg2:#1c1f24;
  --ink:#f2efe9; --amber:#ffb627; --green:#6fe08a; --red:#ff6464; --dim:#8a8f98;
  --line:#23262c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink); min-height:100dvh;
  font-family:-apple-system,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:var(--frame);
  border-bottom:1px solid var(--line); padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:15px;letter-spacing:.22em;font-weight:700}
.brandrow .jp{font-size:11px;color:var(--dim)}
.totals{margin-left:auto;font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--amber)}
.totals .bad{color:var(--red)} .totals .good{color:var(--green)}

/* 開催日タブ */
#days{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
#days::-webkit-scrollbar{display:none}
#days button{
  flex:0 0 auto;background:#15181d;color:#9aa0a6;border:1px solid #2c3038;
  border-radius:999px;font-size:11px;padding:5px 12px;cursor:pointer;white-space:nowrap;
  font-family:"SF Mono",Menlo,monospace;
}
#days button.on{background:#2a2e35;color:var(--amber);border-color:var(--amber)}

/* フラップ表示。日本語はこの charset に乗らないので英数字だけに使う */
.flap{display:inline-flex;gap:2px;vertical-align:middle}
.cell{
  position:relative;width:calc(var(--ch) * .68);height:var(--ch);--ch:22px;
  border-radius:3px;background:#000;overflow:hidden;
  font-family:"Helvetica Neue",Arial,sans-serif;
}
.cell .half{
  position:absolute;left:0;right:0;height:50%;overflow:hidden;
  background:linear-gradient(180deg,var(--cellbg1),var(--cellbg2));
  display:flex;justify-content:center;
}
.cell .half span{
  font-size:calc(var(--ch) * .70);font-weight:700;line-height:var(--ch);color:var(--ink);
}
.cell .top{top:0;border-radius:3px 3px 0 0}
.cell .top span{transform:translateY(0)}
.cell .bot{bottom:0;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,#202329,#16181d)}
.cell .bot span{transform:translateY(calc(var(--ch) * -.5))}
.cell::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;
  background:rgba(0,0,0,.65);transform:translateY(-50%);z-index:5}

main{padding:12px 12px 40px;max-width:900px;margin:0 auto}
.daysum{
  font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.8;
  font-family:"SF Mono",Menlo,monospace;
}
.daysum b{color:var(--ink);font-weight:700}

/* 絞り込み */
#filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#filters button{
  background:#0e1013;border:1px solid #2c3038;color:#9aa0a6;border-radius:999px;
  font-size:11px;padding:5px 12px;cursor:pointer;letter-spacing:.05em;
}
#filters button.on{border-color:var(--amber);color:var(--amber);background:#241d0d}

/* レースカード */
.race{
  background:var(--frame);border:1px solid var(--line);border-radius:14px;
  margin-bottom:10px;overflow:hidden;
}
.race.skip{opacity:.55}
.rhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.mark{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-size:17px;font-weight:700;border:1px solid;
}
.m-◎{color:var(--amber);border-color:var(--amber);background:#241d0d}
.m-○{color:var(--green);border-color:#2f5c3c;background:#121e16}
.m-△{color:#9aa0a6;border-color:#2c3038;background:#15181d}
.m-× {color:var(--dim);border-color:#26292f;background:#101216}
.rtitle{flex:1;min-width:0}
.rtitle .l1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle .l2{font-size:11px;color:var(--dim);margin-top:2px;
  font-family:"SF Mono",Menlo,monospace}
.grade{color:var(--amber);font-size:10px;border:1px solid var(--amber);
  border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.spend{flex:0 0 auto;font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--dim);text-align:right}
.spend .hit{color:var(--green);font-weight:700}
.spend .miss{color:var(--red)}

.rbody{display:none;border-top:1px solid var(--line);padding:12px 13px}
.race.open .rbody{display:block}
.reason{font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:11px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;color:var(--dim);font-weight:400;font-size:10px;
  letter-spacing:.1em;padding:4px 5px;border-bottom:1px solid var(--line);
}
td{padding:6px 5px;border-bottom:1px solid #1a1d22;vertical-align:top}
tr.marked td{background:#15181d}
tr.placed td{background:#121e16}
.umaban{
  display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;
  background:#2c3038;font-family:"SF Mono",Menlo,monospace;font-size:11px;font-weight:700;
}
.hname{font-weight:700}
.hmark{font-size:14px;font-weight:700}
.why{color:var(--dim);font-size:10px;line-height:1.6;margin-top:3px}
.num{font-family:"SF Mono",Menlo,monospace;text-align:right;white-space:nowrap}

.bets{margin-top:13px;border-top:1px dashed #2c3038;padding-top:11px}
.bets h3{font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:7px}
.bet{
  display:flex;align-items:center;gap:9px;font-family:"SF Mono",Menlo,monospace;
  font-size:12px;padding:3px 0;
}
.bet .combo{color:var(--amber);font-weight:700;min-width:78px}
.bet .amt{color:var(--ink);min-width:56px;text-align:right}
.bet .why2{color:var(--dim);font-size:10px;font-family:-apple-system,sans-serif}
.bet.won .combo{color:var(--green)}
.result{margin-top:11px;font-size:12px;font-family:"SF Mono",Menlo,monospace;color:var(--dim)}
.result b{color:var(--ink)}
.empty{color:var(--dim);font-size:12px;padding:26px 0;text-align:center;line-height:1.9}
.note{color:var(--dim);font-size:10px;line-height:1.8;margin-top:22px;
  border-top:1px solid var(--line);padding-top:13px}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <h1>KEIBA BOARD</h1>
    <span class="jp">中央競馬 自動予想</span>
    <span class="totals" id="totals"></span>
  </div>
  <div id="days"></div>
</header>

<main>
  <div class="daysum" id="daysum"></div>
  <div id="filters">
    <button data-f="all" class="on">ALL</button>
    <button data-f="bet">買い目あり</button>
    <button data-f="◎">◎ 勝負</button>
    <button data-f="○">○</button>
    <button data-f="△">△</button>
    <button data-f="×">× 見送り</button>
  </div>
  <div id="races"></div>
  <p class="note">
    ◎○△× はレース単位の自信度。能力評価の上位3頭がどれだけ人気薄に寄っているかで決まる。
    × は上位人気で堅く収まる形と判断したもので、買い目を出さない。<br>
    馬の能力スコアにオッズ・人気は一切使っていない。人気を見るのは自信度の判定と配分だけ。<br>
    競馬は不確実性を伴う。この予想は的中を保証しない。
  </p>
</main>

<script>
"use strict";

/* ===== split-flap: index.html の実装を流用 =====
   日本語はこの charset に乗らないので、フラップは英数字（自信度・買い目・
   金額）にだけ使い、馬名やレース名は通常のテキストで描く。 */
const CHARSET=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:/.-+%";
const CIDX={};[...CHARSET].forEach((c,i)=>CIDX[c]=i);
const norm=c=>{c=(c||" ").toUpperCase();return CIDX[c]===undefined?" ":c};

function flap(text,size){
  const wrap=document.createElement("span");
  wrap.className="flap";
  [...String(text)].forEach(ch=>{
    const c=document.createElement("span");
    c.className="cell";
    if(size)c.style.setProperty("--ch",size+"px");
    const g=norm(ch);
    c.innerHTML=`<span class="half top"><span>${g}</span></span>`+
                `<span class="half bot"><span>${g}</span></span>`;
    wrap.appendChild(c);
  });
  return wrap;
}

const yen=n=>(n==null?"—":n.toLocaleString("ja-JP")+"円");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;
  if(h!=null)e.innerHTML=h;return e};

/* ===== データ読み込み ===== */
let INDEX=null, DAY=null, FILTER="all";

async function boot(){
  try{
    INDEX=await (await fetch("data/index.json",{cache:"no-cache"})).json();
  }catch(e){
    document.getElementById("races").innerHTML=
      '<p class="empty">data/index.json を読めない。<br>'+
      'keiba-predict ワークフローがまだ走っていない可能性がある。</p>';
    return;
  }
  if(!INDEX.days||!INDEX.days.length){
    document.getElementById("races").innerHTML=
      '<p class="empty">まだ予想がない。</p>';
    return;
  }
  renderTotals();
  renderDays();
  await load(INDEX.days[0].date);
}

function renderTotals(){
  const t=INDEX.days.reduce((a,d)=>({
    spend:a.spend+(d.spend||0), ret:a.ret+(d.returned||0), hits:a.hits+(d.hits||0)
  }),{spend:0,ret:0,hits:0});
  if(!t.spend)return;
  const roi=t.ret/t.spend*100;
  document.getElementById("totals").innerHTML=
    `通算 ${t.hits}的中 / <span class="${roi>=100?'good':'bad'}">回収率 ${roi.toFixed(1)}%</span>`;
}

function renderDays(){
  const box=document.getElementById("days");
  box.innerHTML="";
  INDEX.days.forEach(d=>{
    const b=el("button",null,d.date.slice(5));
    b.dataset.date=d.date;
    b.onclick=()=>load(d.date);
    box.appendChild(b);
  });
}

async function load(date){
  [...document.querySelectorAll("#days button")]
    .forEach(b=>b.classList.toggle("on",b.dataset.date===date));
  DAY=await (await fetch(`data/${date}.json`,{cache:"no-cache"})).json();
  renderSummary();
  renderRaces();
}

function renderSummary(){
  const s=DAY.summary, c=s.by_confidence||{};
  let html=`<b>${DAY.date}</b> ／ ${s.races}R 中 <b>${s.bet}R</b> を勝負・`+
           `${s.skipped}R 見送り<br>`+
           `◎${c["◎"]||0} ○${c["○"]||0} △${c["△"]||0} ×${c["×"]||0}`+
           ` ／ 投資 <b>${yen(s.spend)}</b>`;
  if(s.returned!=null){
    const roi=s.roi==null?0:s.roi;
    html+=` → 払戻 <b>${yen(s.returned)}</b>`+
          ` <span style="color:${roi>=100?'var(--green)':'var(--red)'}">`+
          `回収率 ${roi.toFixed(1)}%</span>（的中 ${s.hits}R）`;
  }else{
    html+=" ／ 結果待ち";
  }
  document.getElementById("daysum").innerHTML=html;
}

document.getElementById("filters").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  FILTER=b.dataset.f;
  [...document.querySelectorAll("#filters button")]
    .forEach(x=>x.classList.toggle("on",x===b));
  renderRaces();
};

function visible(r){
  if(FILTER==="all")return true;
  if(FILTER==="bet")return r.bets.length>0;
  return r.confidence===FILTER;
}

function renderRaces(){
  const box=document.getElementById("races");
  box.innerHTML="";
  const list=DAY.races.filter(visible);
  if(!list.length){box.appendChild(el("p","empty","該当するレースがない。"));return}
  list.forEach(r=>box.appendChild(raceCard(r)));
}

function raceCard(r){
  const card=el("div","race"+(r.bets.length?"":" skip"));
  const head=el("div","rhead");

  // ◎○△× は split-flap の charset に無い記号なので、フラップにせず直接描く
  const mark=el("div","mark m-"+r.confidence);
  mark.textContent=r.confidence;
  head.appendChild(mark);

  const t=el("div","rtitle");
  t.appendChild(el("div","l1",
    `${r.venue}${r.race_no}R ${r.name}`+(r.grade?`<span class="grade">${r.grade}</span>`:"")));
  const cond=[`${r.surface}${r.direction||""}${r.distance}m`,
              r.going?`馬場${r.going}`:null, r.post_time, `${r.field_size}頭`,
              r.pace?`${r.pace}想定`:null].filter(Boolean).join(" / ");
  t.appendChild(el("div","l2",cond));
  head.appendChild(t);

  const sp=el("div","spend");
  if(r.bets.length){
    sp.innerHTML=`${r.bets.length}点<br>${yen(r.spend)}`;
    if(r.result){
      sp.innerHTML+=r.result.hit
        ? `<br><span class="hit">+${yen(r.result.returned)}</span>`
        : `<br><span class="miss">不的中</span>`;
    }
  }else{
    sp.innerHTML="見送り";
  }
  head.appendChild(sp);

  head.onclick=()=>card.classList.toggle("open");
  card.appendChild(head);
  card.appendChild(raceBody(r));
  return card;
}

function raceBody(r){
  const body=el("div","rbody");
  body.appendChild(el("div","reason",r.confidence_reason||""));

  const placed=new Set((r.result&&r.result.top3)||[]);
  const tbl=el("table");
  tbl.innerHTML="<thead><tr><th>印</th><th>馬番</th><th>馬名 / 根拠</th>"+
                "<th class='num'>スコア</th><th class='num'>脚質</th>"+
                "<th class='num'>人気</th></tr></thead>";
  const tb=el("tbody");
  r.horses.forEach(h=>{
    const tr=el("tr",(h.mark?"marked ":"")+(placed.has(h.umaban)?"placed":""));
    tr.appendChild(el("td","hmark",h.mark||""));
    tr.appendChild(el("td",null,`<span class="umaban">${h.umaban}</span>`));
    const why=(h.reasons||[]).slice(0,3).join(" ／ ");
    tr.appendChild(el("td",null,
      `<div class="hname">${h.name}</div><div class="why">${why}</div>`));
    tr.appendChild(el("td","num",h.score.toFixed(1)));
    tr.appendChild(el("td","num",h.style+(h.lone_front_runner?" 単騎":"")));
    tr.appendChild(el("td","num",h.popularity?h.popularity+"人":"—"));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  body.appendChild(tbl);

  if(r.bets.length){
    const box=el("div","bets");
    box.appendChild(el("h3",null,`買い目 ${r.bets.length}点 ／ 合計 ${yen(r.spend)}`));
    const winTrio=r.result?[...r.result.top3].sort((a,b)=>a-b).join("-"):null;
    const winTri=r.result?r.result.top3.join("-"):null;
    r.bets.forEach(b=>{
      const won=(b.type==="三連複"&&b.combination===winTrio)||
                (b.type==="三連単"&&b.combination===winTri);
      const row=el("div","bet"+(won?" won":""));
      row.appendChild(el("span",null,b.type));
      const combo=el("span","combo");
      combo.appendChild(flap(b.combination,18));
      row.appendChild(combo);
      row.appendChild(el("span","amt",yen(b.amount)));
      row.appendChild(el("span","why2",b.why+(won?" ★的中":"")));
      box.appendChild(row);
    });
    body.appendChild(box);
  }

  if(r.result){
    const names=r.result.top3_names||[];
    body.appendChild(el("div","result",
      `結果 <b>${r.result.top3.join(" → ")}</b>`+
      (names.length?`（${names.join(" → ")}）`:"")+
      (r.result.hit?` ／ <b style="color:var(--green)">的中 ${yen(r.result.returned)}</b>`:"")));
  }
  return body;
}

boot();
</script>
</body>
</html>
