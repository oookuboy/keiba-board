name: keiba-weekend

# 開催日の定常運用。cron は UTC で、JST = UTC+9。
#
# GitHub Actions の cron は数分〜数十分遅れて発火する。発走直前の情報
# （馬体重は発走約50分前確定）を当て込む運用は成立しないため、
# 前日夜に予想を確定させ、当日朝に馬場状態と取消だけを反映して作り直す。

on:
  schedule:
    # 木 20:00 JST = 木 11:00 UTC — JRA が出馬表を公開する日。取れるだけ取って
    # 暫定予想（能力評価と印のみ・買い目なし）を出す。当日の本予想で上書きする
    - cron: "0 11 * * 4"
    # 金 21:00 JST = 金 12:00 UTC — 出馬表が出そろったころに収集
    - cron: "0 12 * * 5"
    # 土日 05:00 JST = 金土 20:00 UTC — 前日夜の予想確定
    - cron: "0 20 * * 5,6"
    # 土日 07:00 JST = 土日 22:00 UTC(前日) — 当日朝の再生成
    - cron: "0 22 * * 5,6"
    # 土日 22:00 JST = 土日 13:00 UTC — **当日の**結果照合と回顧
    #
    # 一度これで着順を1件も取れず翌朝に倒したが、原因は時刻ではなく経路だった。
    # db.netkeiba は結果データベースで反映が遅い。JRA公式は確定後すぐ出るので、
    # そちらを先に見るようにした今なら当日中に回せる。
    - cron: "0 13 * * 6,0"
    # 日月 09:00 JST = 土日 00:00 UTC — 前日ぶんの取りこぼしを拾う
    #
    # 当日の回顧が終わっていても害は無い。回顧は「前より多く照合できたとき
    # だけ」記録を差し替えるので、遅れて出た着順を拾い直す保険になる。
    - cron: "0 0 * * 0,1"
  workflow_dispatch:
    inputs:
      job:
        description: "preview / collect / predict / review"
        required: true
        type: choice
        options: [preview, collect, predict, review]
        default: predict
      date:
        description: "対象日 YYYY-MM-DD（空なら今日）"
        required: false
        default: ""

permissions:
  contents: write
  # 調教は artifact で持ち回っている。名前で最新を拾うのに API を引く。
  actions: read

concurrency:
  # 予想と回顧が同時に走ると raw/ と data/ の取り合いになる
  group: keiba-weekend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      # SQLite は raw から毎回作り直す使い捨てなので、キャッシュに載せて
      # 3年分の再構築を毎回やらずに済ませる
      - uses: actions/cache@v4
        with:
          path: keiba/keiba.db
          key: keiba-db-${{ hashFiles('keiba/raw/**/*.jsonl.gz') }}
          restore-keys: keiba-db-

      - name: どのジョブを走らせるか決める
        id: plan
        run: |
          if [ -n "${{ inputs.job }}" ]; then
            JOB="${{ inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              "0 11 * * 4")     JOB=preview ;;
              "0 12 * * 5")     JOB=collect ;;
              "0 20 * * 5,6")   JOB=predict ;;
              "0 22 * * 5,6")   JOB=predict ;;
              "0 13 * * 6,0")   JOB=review; SAMEDAY=1 ;;
              "0 0 * * 0,1")    JOB=review  ;;
              *)                JOB=predict ;;
            esac
          fi
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then
            # 翌朝の回顧は前日の開催が対象。当日22時の回顧は今日が対象。
            #
            # 回顧の対象日は **UTC** で決める。JST で決めると、cron の遅れが
            # JST の日付を跨いだ瞬間に対象が1日ずれる。当日回顧の cron は
            # 13:00 UTC（＝22:00 JST）で、JST の日付が変わるまで2時間しか
            # 余裕が無い。2026-08-29 に実際そうなった: cron が4時間遅れて
            # 16:55 UTC（＝翌 01:55 JST）に発火し、まだ1レースも走っていない
            # 8/30 を回顧して「対象36R・買い0R・結果未照合」という、成績に
            # 見えるが成績ではない記録を残した。UTC なら 00:00 UTC まで
            # 11時間の余裕がある。
            if [ "$JOB" = "review" ] && [ -z "$SAMEDAY" ]; then
              DATE=$(date -u -d "yesterday" +%F)
            elif [ "$JOB" = "review" ]; then
              DATE=$(date -u +%F)
            else
              DATE=$(TZ=Asia/Tokyo date +%F)
            fi
          fi
          # preview は木曜に走るので「今日」ではなく次の土日を見る
          SAT=$(TZ=Asia/Tokyo date -d "next saturday" +%F)
          SUN=$(TZ=Asia/Tokyo date -d "next sunday" +%F)
          # 有料データの対象。手で日付を指定したときはそちらを優先する。
          # 過ぎた開催に対して収集をやり直せないと、金曜まで検証できない。
          PAID="${{ inputs.date }}"
          [ -n "$PAID" ] || PAID="$SAT"
          echo "paid=$PAID" >> "$GITHUB_OUTPUT"
          echo "sat=$SAT"  >> "$GITHUB_OUTPUT"
          echo "sun=$SUN"  >> "$GITHUB_OUTPUT"
          echo "job=$JOB"   >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "→ $JOB / $DATE"

      # 木曜。出馬表が公開される日なので、取れるだけ取って暫定予想を出す。
      # 発走前の出馬表が db.netkeiba に出るかは未確定（8/5 時点では開催場の名前は
      # 出るが race_id が0件だった）。取れなかったことが分かるよう、収集が空なら
      # 明示的に落とす。静かに空のボードを出すほうが害が大きい。
      - name: Preview（木曜の下見）
        if: steps.plan.outputs.job == 'preview'
        run: |
          set -o pipefail
          SAT="${{ steps.plan.outputs.sat }}"
          SUN="${{ steps.plan.outputs.sun }}"
          echo "対象: $SAT / $SUN"
          # 発走前は JRA公式が唯一の経路。db.netkeiba には race_id が無い
          python -m keiba.cli collect --upcoming
          python -m keiba.cli build

          FOUND=0
          for D in "$SAT" "$SUN"; do
            N=$(python - "$D" <<'PY'
          import sys, sqlite3
          c = sqlite3.connect("keiba/keiba.db")
          print(c.execute(
              "SELECT COUNT(*) FROM races WHERE race_date = ?", (sys.argv[1],)
          ).fetchone()[0])
          PY
          )
            echo "$D: $N レース"
            [ "$N" -gt 0 ] || continue
            FOUND=$((FOUND + 1))
            python -m keiba.cli predict --date "$D" --provisional
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::発走前の出馬表を1レースも収集できなかった。"\
          "db.netkeiba に race_id が生えていない可能性が高い（sources/jra.py が必要）"
            exit 1
          fi

      # 調教（netkeiba 有料）を手元に戻す。予想する側でも学習した側と同じ列が
      # 埋まっていないと、モデルが使っている特徴量が本番だけ欠損になる。
      - name: 調教を artifact から戻す
        if: steps.plan.outputs.job != 'review'
        uses: ./.github/actions/workouts
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 金曜。枠順が確定するので、ここで初めて馬番の入った出馬表が取れる
      - name: Collect
        if: steps.plan.outputs.job == 'collect'
        run: |
          python -m keiba.cli collect --upcoming
          python -m keiba.cli build

      # 今週の出走馬の調教を引き直す。約500頭・1.5秒ウェイトで約12分。
      #
      # 一度引いた馬も対象にする。調教は毎週更新され、特徴量は21日より古い
      # ものを捨てるので、8月に引いた履歴は10月のレースでは1本も残らない。
      # ここが無いと、本番だけ調教が全馬欠損のまま動くことになる。
      #
      # 落ちても予想は続ける。調教が無ければ欠損として扱われるだけで、
      # 有料データの不調で週末の運用ごと止めるほうが害が大きい。
      - name: 今週の追い切りと厩舎コメントを引く
        if: steps.plan.outputs.job == 'collect'
        continue-on-error: true
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: |
          PAID="${{ steps.plan.outputs.paid }}"
          python -m keiba.cli -v \
            --workouts keiba/raw/workouts.jsonl.gz \
            collect-paid --date "$PAID" --days 2
          python -m keiba.cli build

      # 過去の履歴は馬単位のページにしか無い。レース単位で取れるのは当該
      # レース向けの1本だけなので、「直近21日に何本」を埋めるには両方要る。
      # 未取得の馬を少しずつ埋める。落ちても週末は続ける。
      - name: 調教の履歴を埋める（未取得ぶん）
        if: steps.plan.outputs.job == 'collect'
        continue-on-error: true
        env:
          NETKEIBA_EMAIL: ${{ secrets.NETKEIBA_EMAIL }}
          NETKEIBA_PASSWORD: ${{ secrets.NETKEIBA_PASSWORD }}
        run: |
          python -m keiba.cli -v \
            --workouts keiba/raw/workouts.jsonl.gz \
            backfill-workouts --limit 300

      # 収集が失敗しても週末は続ける（continue-on-error）が、そのぶん
      # **黙って調教なしに戻る**。課金切れ・ログイン失敗・仕様変更のどれも
      # ジョブは緑のままなので、中身を数えて見えるようにする。
      #
      # 「収集は成功・中身は空」はこの開発で何度も踏んでいる形。
      # `::warning::` はログの中に埋もれる。実際 2026-08-28 に 18.1% で鳴って
      # いたのに、ジョブが緑だったので数日気づかなかった。
      # 数字をファイルに残してコミットし、ボードの見出しにも出す。
      - name: 今週の調教が入ったか確かめる
        if: steps.plan.outputs.job == 'collect'
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib, sqlite3
          conn = sqlite3.connect("keiba/keiba.db")
          today = dt.date.today()
          # 特徴量は21日より古い調教を捨てる。その窓に入るものを数える
          since = (today - dt.timedelta(days=21)).isoformat()
          runners, fresh = conn.execute(
              """
              SELECT COUNT(DISTINCT e.horse_id),
                     COUNT(DISTINCT CASE WHEN w.horse_id IS NOT NULL
                                         THEN e.horse_id END)
              FROM entries e
              JOIN races r ON r.race_id = e.race_id
              LEFT JOIN horse_workouts w
                     ON w.horse_id = e.horse_id AND w.workout_date >= ?
              WHERE r.race_date >= ?
              """,
              (since, today.isoformat()),
          ).fetchone()
          rate = fresh / runners if runners else 0.0
          print(f"今週の出走馬 {runners:,}頭 / 直近21日の調教あり {fresh:,}頭 ({rate:.1%})")

          out = pathlib.Path("keiba/data/health.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          health = json.loads(out.read_text()) if out.exists() else {}
          health["workouts"] = {
              "checked": today.isoformat(),
              "runners": runners,
              "fresh": fresh,
              "rate": round(rate, 3),
          }
          out.write_text(json.dumps(health, ensure_ascii=False), encoding="utf-8")

          if rate < 0.5:
              print(
                  "::warning::今週の調教が半分も入っていない"
                  f"（{rate:.1%}）。課金状態と Secrets を確認すること"
              )
          PY

      # 期限を更新して上げ直す。これで90日の時計が毎週リセットされ、
      # 週次で回っている限り消えない。
      - name: 調教を artifact へ戻す
        if: steps.plan.outputs.job == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: workouts
          path: keiba/raw/workouts.jsonl.gz
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Predict
        if: steps.plan.outputs.job == 'predict'
        run: |
          # 当日の確定情報（馬体重・オッズ・取消）を取り直してから予想し直す
          python -m keiba.cli collect --upcoming || true
          python -m keiba.cli build
          python -m keiba.cli predict --date "${{ steps.plan.outputs.date }}"

      # 着順はまず JRA公式から取る。db.netkeiba は結果データベースだが反映が
      # 遅く、開催当日の夜になっても race_id を1件も出していなかった（実測）。
      # JRA が確定前なら netkeiba へ落とす（翌日以降はこちらでも取れる）。
      - name: Review
        if: steps.plan.outputs.job == 'review'
        run: |
          DATE="${{ steps.plan.outputs.date }}"
          python -m keiba.cli collect --date "$DATE" --results --from-jra \
            || python -m keiba.cli collect --date "$DATE" --days-ahead 0 --results
          python -m keiba.cli build
          python -m keiba.cli review --date "$DATE" --catch-up

      # 収集は済んだのに予想で落ちた、という形でも生データは残す。
      # 取り直しには1.5秒ウェイトぶんの時間がかかるので捨てたくない。
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keiba/data と LESSONS.md は predict / review が初めて成功するまで
          # 存在しない。存在しないパスを git add に渡すと exit 128 で落ち、
          # 直前の本当のエラーを覆い隠してしまう（実際そうなった）。
          # シェルは bash -e なので、[ ] && cmd の形は条件が偽のときの終了ステータスで
          # ジョブごと落ちうる。if で明示する。
          for path in keiba/raw keiba/data keiba/config keiba/LESSONS.md; do
            if [ -e "$path" ]; then
              git add -A "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "chore(keiba): ${{ steps.plan.outputs.job }} ${{ steps.plan.outputs.date }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
