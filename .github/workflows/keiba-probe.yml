name: keiba-probe

# パーサを書くための実HTMLフィクスチャを採取する。
# 開発時に手で1回叩くだけのワークフローで、定常運用には関与しない。

on:
  workflow_dispatch:
    inputs:
      date:
        description: "開催日 YYYYMMDD（空なら直近の日曜）"
        required: false
        default: ""
  # workflow_dispatch はワークフローがデフォルトブランチに無いと API から叩けない。
  # 開発中は作業ブランチへの push で走らせる。main へ入れたら push トリガは外してよい。
  push:
    branches:
      - "claude/keiba-auto-prediction-**"
    paths:
      - ".github/workflows/keiba-probe.yml"
      - "keiba/src/keiba/probe.py"
      - "keiba/src/keiba/sources/http.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Fetch fixtures
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m keiba.probe --date "${{ inputs.date }}"
          else
            python -m keiba.probe
          fi

      - name: Summarise
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("keiba/tests/fixtures/manifest.json").read_text())
          print("kaisai_date:", m["kaisai_date"])
          print("jra_race_ids:", len(m["jra_race_ids"]), m["jra_race_ids"][:5])
          for p in m["pages"]:
              print(
                  "OK  " if p["ok"] else "FAIL",
                  p["label"].ljust(28),
                  str(p.get("chars", "")).rjust(7),
                  p.get("title") or p.get("error", ""),
              )
          PY

      # 採取さえできていればコミットする。集計の失敗でフィクスチャを捨てない。
      - name: Commit fixtures
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A keiba/tests/fixtures
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "chore(keiba): probe でHTMLフィクスチャを採取"
            # 実行中にブランチが進んでいると push が非 fast-forward で落ちる。
            # 採取結果を捨てないよう、rebase してから押し込む。
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
