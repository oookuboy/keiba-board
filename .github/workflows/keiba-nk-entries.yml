name: keiba-nk-entries

# netkeiba の確定前の出馬表（登録馬）から馬名と馬IDを出す。手で回す用。
# このセッションからは netkeiba に届かないので Actions を通す。無料ページのみ。

on:
  workflow_dispatch:
    inputs:
      race_ids:
        description: "race_id（空白区切りで複数可）"
        required: true

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: 登録馬を出す
        run: python -m keiba.cli nk-entries ${{ inputs.race_ids }}
