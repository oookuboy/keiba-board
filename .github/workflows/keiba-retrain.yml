name: keiba-retrain

# 能力モデルの定期再学習。
#
# 放置するとモデルは劣化する。騎手の調子・種牡馬の傾向・馬場は動くのに、
# モデルは学習した時点で凍結されるため。実際 2026-08-05 に学習したきり
# 一度も更新されていなかった（どのワークフローにも train が無かった）。
#
# 頻度は月1。2週間ごとにしても増えるデータは +1.3%（週末1回で約940行 /
# 総数14.8万行）で誤差にしかならず、再学習のたびに「うっかり悪いモデルへ
# 差し替わる」リスクだけが増える。
#
# 頻度より効くのは検証窓をずらすこと。固定のままだと時が経つほど
# 「古いデータで検証している」状態になる。毎回、直近3か月を検証に回す。

on:
  schedule:
    # 毎月1日 05:00 JST = 前月末 20:00 UTC。開催の無い時間帯を選ぶ
    - cron: "0 20 28 * *"
  workflow_dispatch:
    inputs:
      valid_from:
        description: "検証開始日 YYYY-MM-DD（空なら3か月前）"
        required: false
        default: ""
      force:
        description: "AUCが下がっても差し替える"
        type: boolean
        default: false
      objective:
        description: "binary（1頭ずつ）/ lambdarank（レース内の順位を学習）"
        required: false
        type: choice
        options: [binary, lambdarank]
        default: binary

permissions:
  contents: write
  # 調教は artifact で持ち回っている。名前で最新を拾うのに API を引く。
  actions: read

concurrency:
  group: keiba-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --default-timeout=180 -e .
      - run: pip install --default-timeout=180 lightgbm

      - uses: actions/cache@v4
        with:
          path: keiba/keiba.db
          key: keiba-db-${{ hashFiles('keiba/raw/**/*.jsonl.gz') }}
          restore-keys: keiba-db-

      # 調教（netkeiba 有料）はコミットできないので artifact から戻す。
      # ここが無いと、調教の列が全行欠損のモデルが出来上がり、予想側だけ
      # 値が入っている状態になる（学習と本番で特徴量の中身がずれる）。
      - name: 調教を artifact から戻す
        uses: ./.github/actions/workouts
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: python -m keiba.cli build

      - name: Retrain
        id: retrain
        run: |
          VF="${{ inputs.valid_from }}"
          # 検証窓を毎回ずらす。固定すると古いデータで検証し続けることになる
          [ -n "$VF" ] || VF=$(date -u -d "3 months ago" +%F)
          echo "検証開始日: $VF"

          FORCE=""
          [ "${{ inputs.force }}" = "true" ] && FORCE="--force"

          # AUC が既定より下がったら cmd_train が exit 1 で差し替えを拒む
          # $FORCE と同じ形にする。GitHub の式の中に || を書くと、ワークフローの
          # 引数を検証するテストが値の区切りと取り違える。
          #
          # コメントであっても式の記法をそのまま書いてはいけない。GitHub は
          # run ブロック全体を走査するので、空の式が構文エラーになる（実際に
          # ここで workflow_dispatch が弾かれた）。
          OBJ=""
          [ -n "${{ inputs.objective }}" ] && OBJ="--objective ${{ inputs.objective }}"
          if python -m keiba.cli train $OBJ --valid-from "$VF" $FORCE; then
            echo "replaced=yes" >> "$GITHUB_OUTPUT"
          else
            echo "replaced=no" >> "$GITHUB_OUTPUT"
            echo "::warning::AUC が低下したためモデルを差し替えなかった"
          fi

      - name: Commit
        if: steps.retrain.outputs.replaced == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 種牡馬適性も一緒に入れる。build が毎回作り直すファイルで、
          # モデルと同じデータから計算されている。以前はモデルの2ファイル
          # しか add しておらず、作業ツリーに変更が残ったまま rebase しよう
          # として「You have unstaged changes」で落ちた（2026-09-24）。
          # 学習は成功していたのに、モデルが push されずに消えた。
          git add -A keiba/config/model.txt keiba/config/model.json \
                     keiba/config/sire_aptitude.json
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "chore(keiba): モデルを再学習"
          # 他に残った変更があっても rebase を止めない
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
